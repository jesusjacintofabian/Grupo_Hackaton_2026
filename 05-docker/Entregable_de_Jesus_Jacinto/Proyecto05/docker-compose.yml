services:

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile

    ports:
      - "80:80"

    depends_on:
      api:
        condition: service_healthy

    networks:
      - frontend

  api:

    build:
      context: ./api
      dockerfile: ../docker/api/Dockerfile

    env_file:
      - .env

    networks:
      - frontend
      - backend

    depends_on:
      db:
        condition: service_healthy

    healthcheck:
      test: ["CMD","curl","-f","http://localhost:8000/health"]

      interval: 10s

      timeout: 5s

      retries: 5

      start_period: 20s

  db:

    image: mysql:8.4

    restart: always

    env_file:
      - .env

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - backend

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost"
        ]

      interval: 10s

      timeout: 5s

      retries: 5

volumes:

  mysql_data:

networks:

  frontend:

  backend:
