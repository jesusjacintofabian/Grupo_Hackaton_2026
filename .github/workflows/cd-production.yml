name: Continuous Delivery - Production

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/proyecto05-api
  CONTAINER_NAME: proyecto05-api-production
  PORT: 8001

jobs:
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest

    environment:
      name: production

    steps:

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Docker image
        run: |
          docker pull ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Deploy container
        run: |
          docker rm -f ${{ env.CONTAINER_NAME }} 2>/dev/null || true

          docker run -d \
            --name ${{ env.CONTAINER_NAME }} \
            -p ${{ env.PORT }}:8000 \
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Health check
        run: |
          echo "Esperando que Production esté disponible..."

          for i in {1..10}; do
            if curl --fail --silent http://localhost:${{ env.PORT }}/health; then
              echo
              echo "Health check de Production exitoso."
              exit 0
            fi

            echo "Intento $i/10: servicio todavía no disponible..."
            sleep 5
          done

          echo "Health check de Production fallido."
          docker logs ${{ env.CONTAINER_NAME }}
          exit 1

      - name: Verify deployment
        run: |
          echo "Production desplegado correctamente."
          docker ps
