name: Continuous Delivery - Staging

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  PROJECT_DIR: 05-docker/Entregable_de_Jesus_Jacinto/Proyecto05
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/proyecto05-api

jobs:

  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.PROJECT_DIR }}/api
          file: ${{ env.PROJECT_DIR }}/docker/api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
