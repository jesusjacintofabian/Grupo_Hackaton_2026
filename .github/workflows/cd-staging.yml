name: Continuous Delivery - Staging

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  PROJECT_DIR: 05-docker/Entregable_de_Jesus_Jacinto/Proyecto05
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/proyecto05-api

jobs:

  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.PROJECT_DIR }}/api
          file: ${{ env.PROJECT_DIR }}/docker/api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max


  deploy-staging:
    name: Deploy to Staging
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull staging image
        run: |
          docker pull ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Deploy container
        run: |
          docker rm -f proyecto05-api-staging 2>/dev/null || true

          docker run -d \
            --name proyecto05-api-staging \
            -p 8000:8000 \
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Health check
        run: |
          echo "Esperando que la API esté disponible..."

          for i in {1..10}; do
            if curl --fail --silent http://localhost:8000/health; then
              echo
              echo "Health check exitoso."
              exit 0
            fi

            echo "Intento $i/10: servicio todavía no disponible..."
            sleep 5
          done

          echo "Health check fallido."
          docker logs proyecto05-api-staging
          exit 1

      - name: Verify deployment
        run: |
          echo "Staging desplegado correctamente."
          docker ps
