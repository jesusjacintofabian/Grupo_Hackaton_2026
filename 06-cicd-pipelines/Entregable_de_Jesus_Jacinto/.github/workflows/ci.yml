name: Continuous Integration

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:

  ####################################
  # LINT
  ####################################
  lint:

    name: Ruff + Black
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          pip install -r api/requirements.txt

          pip install \
            ruff \
            black

      - name: Ruff
        run: |
          ruff check .

      - name: Black
        run: |
          black --check .

  ####################################
  # TYPE CHECK
  ####################################
  type-check:

    name: MyPy
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - run: |
          python -m pip install --upgrade pip

          pip install -r api/requirements.txt

          pip install mypy

      - name: Run MyPy
        run: |
          mypy api || true

  ####################################
  # TESTS
  ####################################
  tests:

    name: Pytest
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - run: |
          python -m pip install --upgrade pip

          pip install -r api/requirements.txt

          pip install \
            pytest \
            pytest-cov

      - name: Run Tests
        run: |
          pytest -v \
                 --cov=api \
                 --cov-report=xml

      - name: Upload Coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  ####################################
  # SECURITY
  ####################################
  security:

    name: Bandit
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - run: |
          python -m pip install --upgrade pip

          pip install bandit

      - name: Run Bandit
        run: |
          bandit -r api

  ####################################
  # DOCKER BUILD
  ####################################
  docker-build:

    name: Docker Build

    needs:
      - lint
      - type-check
      - tests
      - security

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image

        uses: docker/build-push-action@v6

        with:

          context: .

          file: docker/api/Dockerfile

          push: false

          tags: proyecto05-api:latest
